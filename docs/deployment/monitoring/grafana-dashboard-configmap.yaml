# ConfigMap that auto-provisions the llm-d KV-Cache core library dashboard in Grafana.
# Requires a Grafana sidecar dashboard provider (e.g., grafana.sidecar.dashboards.enabled=true)
# or the file-based provider configured in grafana.yaml.
#
# This dashboard covers the *core library* (kvcache_* metrics): index throughput and
# efficiency, lookup/tokenization latency, and kvevents subscriber health. It is separate
# from the llmd_fs_backend connector dashboard (vllm:kv_offload_* metrics).
apiVersion: v1
kind: ConfigMap
metadata:
  name: kvcache-core-dashboard
  labels:
    grafana_dashboard: "1"
data:
  kvcache-core.json: |-
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": { "limit": 100, "matchAny": false, "tags": [], "type": "dashboard" },
            "type": "dashboard"
          }
        ]
      },
      "description": "Operational dashboard for the llm-d KV-Cache core library: index throughput and efficiency, lookup and tokenization latency, and kvevents subscriber health.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Index Throughput & Efficiency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Rate of KV-block index operations: admissions, evictions, and lookup calls.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "ops" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(rate(kvcache_index_admissions_total[$__rate_interval]))", "legendFormat": "Admissions/s", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(rate(kvcache_index_evictions_total[$__rate_interval]))", "legendFormat": "Evictions/s", "refId": "B" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(rate(kvcache_index_lookup_requests_total[$__rate_interval]))", "legendFormat": "Lookups/s", "refId": "C" }
          ],
          "title": "Index Operations Rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Cache hit rate, measured as keys found per lookup call (kvcache_index_lookup_hits_total / kvcache_index_lookup_requests_total).",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "percentunit", "min": 0 } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(rate(kvcache_index_lookup_hits_total[$__rate_interval])) / clamp_min(sum(rate(kvcache_index_lookup_requests_total[$__rate_interval])), 1)", "legendFormat": "Hit Rate", "refId": "A" }
          ],
          "title": "Cache Hit Rate (hits per lookup)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Latency of index Lookup() calls (P50/P90/P99 and average).",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 0, "lineWidth": 1, "spanNulls": false }, "unit": "s" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "id": 3,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.99, sum by(le) (rate(kvcache_index_lookup_latency_seconds_bucket[$__rate_interval])))", "legendFormat": "P99", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.90, sum by(le) (rate(kvcache_index_lookup_latency_seconds_bucket[$__rate_interval])))", "legendFormat": "P90", "refId": "B" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.50, sum by(le) (rate(kvcache_index_lookup_latency_seconds_bucket[$__rate_interval])))", "legendFormat": "P50", "refId": "C" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "rate(kvcache_index_lookup_latency_seconds_sum[$__rate_interval]) / clamp_min(rate(kvcache_index_lookup_latency_seconds_count[$__rate_interval]), 1)", "legendFormat": "Average", "refId": "D" }
          ],
          "title": "Lookup Latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Rate of the maximum cache hits observed on a single pod during Lookup(). Indicates routing/affinity skew toward hot pods.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "ops" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "id": 4,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(rate(kvcache_index_max_pod_hit_count_total[$__rate_interval]))", "legendFormat": "Max Pod Hits/s", "refId": "A" }
          ],
          "title": "Max Pod Hit Count Rate",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "id": 101,
          "title": "Tokenization",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Latency of tokenization, P99/P90/P50 per tokenizer.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 0, "lineWidth": 1, "spanNulls": false }, "unit": "s" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "id": 5,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.99, sum by(le, tokenizer) (rate(kvcache_tokenization_tokenization_latency_seconds_bucket{tokenizer=~\"$tokenizer\"}[$__rate_interval])))", "legendFormat": "P99 {{tokenizer}}", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.90, sum by(le, tokenizer) (rate(kvcache_tokenization_tokenization_latency_seconds_bucket{tokenizer=~\"$tokenizer\"}[$__rate_interval])))", "legendFormat": "P90 {{tokenizer}}", "refId": "B" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.50, sum by(le, tokenizer) (rate(kvcache_tokenization_tokenization_latency_seconds_bucket{tokenizer=~\"$tokenizer\"}[$__rate_interval])))", "legendFormat": "P50 {{tokenizer}}", "refId": "C" }
          ],
          "title": "Tokenization Latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Latency of RenderChatTemplate, P99/P90/P50 per tokenizer.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 0, "lineWidth": 1, "spanNulls": false }, "unit": "s" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "id": 6,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.99, sum by(le, tokenizer) (rate(kvcache_tokenization_render_chat_template_latency_seconds_bucket{tokenizer=~\"$tokenizer\"}[$__rate_interval])))", "legendFormat": "P99 {{tokenizer}}", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.90, sum by(le, tokenizer) (rate(kvcache_tokenization_render_chat_template_latency_seconds_bucket{tokenizer=~\"$tokenizer\"}[$__rate_interval])))", "legendFormat": "P90 {{tokenizer}}", "refId": "B" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "histogram_quantile(0.50, sum by(le, tokenizer) (rate(kvcache_tokenization_render_chat_template_latency_seconds_bucket{tokenizer=~\"$tokenizer\"}[$__rate_interval])))", "legendFormat": "P50 {{tokenizer}}", "refId": "C" }
          ],
          "title": "Chat Template Render Latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Tokens tokenized per second, per tokenizer.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "tps" } },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 26 },
          "id": 7,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by(tokenizer) (rate(kvcache_tokenization_tokenized_tokens_total{tokenizer=~\"$tokenizer\"}[$__rate_interval]))", "legendFormat": "{{tokenizer}}", "refId": "A" }
          ],
          "title": "Tokens Tokenized / sec",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 34 },
          "id": 102,
          "title": "KV-Events Subscriber Health",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Number of active ZMQ subscribers currently connected.",
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "unit": "none", "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "red" }, { "value": 1, "color": "green" } ] } } },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 35 },
          "id": 8,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(kvcache_kvevents_active_subscribers)", "legendFormat": "Active Subscribers", "refId": "A" }
          ],
          "title": "Active Subscribers",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Rate of KV-event messages received over ZMQ, per source pod.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "mps" } },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 35 },
          "id": 9,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by(pod_identifier) (rate(kvcache_kvevents_messages_received_total[$__rate_interval]))", "legendFormat": "{{pod_identifier}}", "refId": "A" }
          ],
          "title": "Messages Received / sec",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Event-processing pool queue depth against its capacity. A queue depth approaching capacity indicates backpressure.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "none" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 43 },
          "id": 10,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(kvcache_kvevents_pool_queue_depth)", "legendFormat": "Queue Depth", "refId": "A" },
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum(kvcache_kvevents_pool_capacity)", "legendFormat": "Capacity", "refId": "B" }
          ],
          "title": "Pool Queue Depth vs Capacity",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Rate of ZMQ errors, broken down by operation.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "ops" } },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 43 },
          "id": 11,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by(operation) (rate(kvcache_kvevents_zmq_errors_total[$__rate_interval]))", "legendFormat": "{{operation}}", "refId": "A" }
          ],
          "title": "ZMQ Errors / sec",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Rate of subscriber reconnections, per source pod. Sustained reconnections indicate an unstable publisher or network.",
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": false }, "unit": "ops" } },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 43 },
          "id": 12,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "expr": "sum by(pod_identifier) (rate(kvcache_kvevents_subscriber_reconnections_total[$__rate_interval]))", "legendFormat": "{{pod_identifier}}", "refId": "A" }
          ],
          "title": "Subscriber Reconnections / sec",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": ["llm-d", "kv-cache", "core"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          },
          {
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(kvcache_tokenization_tokenization_latency_seconds_count, tokenizer)",
            "hide": 0,
            "includeAll": true,
            "label": "Tokenizer",
            "multi": true,
            "name": "tokenizer",
            "query": { "query": "label_values(kvcache_tokenization_tokenization_latency_seconds_count, tokenizer)", "refId": "tokenizer" },
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "llm-d KV-Cache Core Library",
      "uid": "kvcache-core",
      "version": 1
    }
